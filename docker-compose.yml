services:
    be-php:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: symfony_php
        restart: unless-stopped
        env_file:
            - .env.prod.local
        environment:
            APP_ENV: prod
            MERCURE_URL: http://mercure/.well-known/mercure
            MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-https://novatify-mercure.huybach02.io.vn/.well-known/mercure}
            SYMFONY_TRUSTED_PROXIES: ${SYMFONY_TRUSTED_PROXIES:-127.0.0.1,REMOTE_ADDR,private_ranges}
            SYMFONY_TRUSTED_HEADERS: ${SYMFONY_TRUSTED_HEADERS:-x-forwarded-for,x-forwarded-host,x-forwarded-proto,x-forwarded-port}
        volumes:
            - symfony_var:/var/www/html/var
            - symfony_uploads:/var/www/html/public/uploads
            - ./config/jwt:/var/www/html/config/jwt

    be-nginx:
        image: nginx:alpine
        container_name: symfony_nginx
        restart: unless-stopped
        expose:
            - "80"
        volumes:
            - ./public:/var/www/html/public
            - symfony_uploads:/var/www/html/public/uploads
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - be-php

    fe-nginx:
        build:
            context: ./admin
            dockerfile: Dockerfile
            args:
                VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://novatify-api.huybach02.io.vn/api}
                VITE_MERCURE_URL: ${VITE_MERCURE_URL:-https://novatify-mercure.huybach02.io.vn/.well-known/mercure}
        container_name: vue_admin
        restart: unless-stopped
        expose:
            - "80"
        depends_on:
            - be-nginx

    messenger:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: symfony_messenger
        restart: unless-stopped
        env_file:
            - .env.prod.local
        command: php bin/console messenger:consume async -vv --time-limit=3600 --memory-limit=128M
        environment:
            APP_ENV: prod
            MERCURE_URL: http://mercure/.well-known/mercure
            MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-https://novatify-mercure.huybach02.io.vn/.well-known/mercure}
        volumes:
            - symfony_var:/var/www/html/var
            - ./config/jwt:/var/www/html/config/jwt
        depends_on:
            - be-php

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: symfony_scheduler
        restart: unless-stopped
        env_file:
            - .env.prod.local
        command: php bin/console messenger:consume scheduler_default -vv --time-limit=3600 --memory-limit=128M
        environment:
            APP_ENV: prod
            MERCURE_URL: http://mercure/.well-known/mercure
            MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-https://novatify-mercure.huybach02.io.vn/.well-known/mercure}
        volumes:
            - symfony_var:/var/www/html/var
            - ./config/jwt:/var/www/html/config/jwt
        depends_on:
            - be-php

    mercure:
        image: dunglas/mercure
        container_name: mercure_hub
        restart: unless-stopped
        env_file:
            - .env.prod.local
        environment:
            SERVER_NAME: :80
            MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-071c26246473e3a27780cfddf6123f5df4116fb8fc6f1456e04fabbeb8dd193a}
            MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-071c26246473e3a27780cfddf6123f5df4116fb8fc6f1456e04fabbeb8dd193a}
            MERCURE_EXTRA_DIRECTIVES: |
                cors_origins https://novatify.huybach02.io.vn https://novatify-api.huybach02.io.vn https://novatify-mercure.huybach02.io.vn
        expose:
            - "80"

    npm:
        image: jc21/nginx-proxy-manager:latest
        container_name: nginx_proxy_manager
        restart: unless-stopped
        ports:
            - "80:80"
            - "81:81"
            - "443:443"
        volumes:
            - npm_data:/data
            - npm_letsencrypt:/etc/letsencrypt
        depends_on:
            - fe-nginx
            - be-nginx
            - mercure

volumes:
    symfony_var:
    symfony_uploads:
    npm_data:
    npm_letsencrypt:
