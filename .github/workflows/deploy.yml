name: Deploy to Production VPS

on:
    push:
        branches:
            - main

concurrency:
    group: production-deploy
    cancel-in-progress: true

jobs:
    deploy:
        name: Deploy App
        runs-on: ubuntu-latest

        steps:
            - name: Deploy over SSH
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USERNAME }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: ${{ secrets.VPS_PORT || 22 }}
                  timeout: 60s
                  script_stop: true
                  script: |
                      set -eu

                      cd "${{ secrets.VPS_APP_DIR }}"

                      if [ ! -f .env.prod.local ]; then
                        echo ".env.prod.local was not found on the server."
                        exit 1
                      fi

                      echo "[1/10] Update source code"
                      git fetch origin main
                      git checkout main
                      git reset --hard origin/main

                      echo "[2/10] Build Docker images"
                      docker compose --env-file .env.prod.local build --no-cache

                      echo "[3/10] Recreate application services"
                      docker compose --env-file .env.prod.local up -d --force-recreate be-php be-nginx fe-nginx mercure messenger scheduler npm

                      echo "[4/10] Run database migrations"
                      docker compose --env-file .env.prod.local exec -T be-php php bin/console doctrine:migrations:migrate --no-interaction --env=prod

                      echo "[5/10] Clear Symfony cache"
                      docker compose --env-file .env.prod.local exec -T be-php php bin/console cache:clear --env=prod --no-debug

                      echo "[6/10] Show service status"
                      docker compose --env-file .env.prod.local ps

                      echo "[7/10] Verify backend health"
                      docker compose --env-file .env.prod.local logs --tail=50 be-nginx
                      docker compose --env-file .env.prod.local logs --tail=50 be-php

                      echo "[8/10] Verify scheduler service"
                      docker compose --env-file .env.prod.local logs --tail=50 scheduler

                      echo "[9/10] Verify messenger service"
                      docker compose --env-file .env.prod.local logs --tail=50 messenger

                      echo "[10/10] Clean unused Docker resources"
                      docker image prune -af
                      docker builder prune -af

                      echo "====> Deploy completed successfully."
