name: Deploy to AWS EC2

on:
    push:
        branches:
            - main

concurrency:
    group: production-deploy
    cancel-in-progress: true

jobs:
    deploy:
        name: Deploy App
        runs-on: ubuntu-latest

        steps:
            - name: Deploy over SSH
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USERNAME }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  port: ${{ secrets.EC2_PORT || 22 }}
                  timeout: 60s
                  script_stop: true
                  script: |
                      set -eu

                      cd "${{ secrets.EC2_APP_DIR }}"

                      echo "[1/9] Update source code"
                      git fetch origin main
                      git checkout main
                      git reset --hard origin/main

                      echo "[2/9] Export frontend build variables"
                      export VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}"
                      export VITE_MERCURE_URL="${{ secrets.VITE_MERCURE_URL }}"

                      echo "[3/9] Build Docker images"
                      docker compose build --no-cache

                      echo "[4/9] Start or refresh containers"
                      docker compose up -d

                      echo "[5/9] Run database migrations"
                      docker compose exec -T be-php php bin/console doctrine:migrations:migrate --no-interaction --env=prod

                      echo "[6/9] Clear Symfony cache"
                      docker compose exec -T be-php php bin/console cache:clear --env=prod --no-debug

                      echo "[7/9] Show service status"
                      docker compose ps

                      echo "[8/9] Verify scheduler service"
                      docker compose logs scheduler --tail=50

                      echo "[9/9] Clean unused Docker resources"
                      docker image prune -af
                      docker builder prune -af

                      echo "====> Deploy completed successfully."
