<!doctype html>
<html lang="">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="/yak_favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://cdn.jsdelivr.net/npm/@mdi/font@latest/css/materialdesignicons.min.css"
            rel="stylesheet"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
            rel="stylesheet"
        />
        <title>WorkHub</title>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.js"></script>
    </body>
    <style>
        body {
            font-family: "Google Sans", sans-serif;
        }
        .v-list-item__spacer {
            width: 10px !important;
        }
        .v-list-group__items .v-list-item {
            padding-left: 20px !important;
        }
        .header-custom th {
            font-weight: bold !important;
            background-color: rgb(var(--v-theme-primary)) !important;
            color: white !important;
        }
        .filter-header {
            padding: 4px 12px !important;
            color: black !important;
        }
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .table-wrapper .v-data-table {
            min-width: 600px;
        }

        @media (max-width: 768px) {
            .table-wrapper {
                box-shadow: inset -10px 0 10px -10px rgba(0, 0, 0, 0.1);
            }
        }
        .v-data-table-header__th {
            white-space: nowrap;
            background: rgb(var(--v-theme-primary)) !important;
            color: white !important;
            font-weight: bold !important;
        }

        .v-data-table-header__th,
        .v-data-table-header__th * {
            color: white !important;
            --v-theme-on-surface: 255, 255, 255 !important;
            --v-medium-emphasis-opacity: 1 !important;
            --v-high-emphasis-opacity: 1 !important;
            opacity: 1 !important;
        }

        .v-data-table-header__th input::placeholder,
        .v-data-table-header__th .v-field__input::placeholder {
            color: rgba(255, 255, 255, 0.8) !important;
            opacity: 1 !important;
        }

        .v-data-table-header__th .v-icon {
            color: white !important;
            opacity: 1 !important;
        }
        .v-data-table-header__th .v-select__selection,
        .v-data-table-header__th .v-select__selection-text {
            color: white !important;
        }

        .table-wrapper :deep(.v-data-table-footer) {
            border-top: 1px solid #e0e0e0;
        }
        .close-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 1;
        }
        .table-wrapper .v-table__wrapper {
            max-height: none !important;
            overflow-y: visible !important;
            overflow-x: visible !important;
        }

        .table-wrapper .v-table {
            height: auto !important;
        }
    </style>
</html>
